<html>
  <head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="wip.css">
  </head>
  <body>
    <a href="home.html" class="navLink"> Back to Tracker</a>
    <h1>My Works in Progress</h1>
    <div class="inputGroup">
      <input id="titleInput" type="text" placeholder="Project Title">
      <input id="wipWords" type="number" placeholder="Current Word Count">
      <input id="wipGoal" type="number" placeholder="Goal">
      <button id="addWip">Add</button>
    </div>
    <div id="wipList"></div>
    <h1>My Future Works</h1>
    <div class="inputGroup">
      <input id="futureTitleInput" type="text" placeholder="Project Title">
      <button id="addFuture">Add</button>
    </div>
    <div id="futureList"></div>
    <h1>My Past Works</h1>
    <div class="inputGroup">
      <input id="pastTitleInput" type="text" placeholder="Project Title">
      <input id="pastWords" type="number" placeholder="Word Count">
      <button id="addPast">Add</button>
    </div>
    <div id="pastList"></div>
  </body>
  <script src="wip.js"></script>
</html>
